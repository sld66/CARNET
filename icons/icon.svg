<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6bff"/>
      <stop offset=".55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#d14fc0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2a0f6b" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>

  <g filter="url(#sh)">
    <!-- Onglets de sections (dépassent à droite) -->
    <rect x="330" y="146" width="72" height="54" rx="14" fill="#ffb224"/>
    <rect x="330" y="214" width="72" height="54" rx="14" fill="#30d49c"/>
    <rect x="330" y="282" width="72" height="54" rx="14" fill="#4cc3ff"/>

    <!-- Carnet -->
    <rect x="118" y="100" width="258" height="312" rx="30" fill="#ffffff"/>
    <!-- Reliure -->
    <path d="M118 130a30 30 0 0 1 30-30h26v312h-26a30 30 0 0 1-30-30z" fill="#ece7ff"/>
    <g fill="#7c5cff">
      <circle cx="146" cy="160" r="9"/>
      <circle cx="146" cy="256" r="9"/>
      <circle cx="146" cy="352" r="9"/>
    </g>
  </g>

  <!-- Contenu de la page -->
  <rect x="204" y="150" width="130" height="22" rx="11" fill="#7c5cff"/>
  <rect x="204" y="206" width="138" height="14" rx="7" fill="#d9d2fb"/>
  <rect x="204" y="240" width="110" height="14" rx="7" fill="#d9d2fb"/>
  <!-- Case cochée -->
  <rect x="204" y="290" width="40" height="40" rx="11" fill="#7c5cff"/>
  <path d="M213 311l8 8 15-17" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="258" y="303" width="84" height="14" rx="7" fill="#d9d2fb"/>
  <rect x="204" y="352" width="96" height="14" rx="7" fill="#d9d2fb"/>
</svg>
